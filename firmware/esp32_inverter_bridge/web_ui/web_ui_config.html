<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mastervolt Bridge Settings</title>
  <link rel="stylesheet" href="/web_ui.css">
</head>
<body>
<header>
  <div>
    <h1>Mastervolt Bridge Settings</h1>
    <div id="fwVersion">-</div>
  </div>
</header>
<nav><a href="/">Home</a><a href="/config" class="active">Settings</a><a href="/api">API</a></nav>
<main>
  <section><h2>Quick Actions</h2>
    <p><button id="bPulse">Pulse WiFi</button></p>
    <p><button id="bReconnect">Force Reconnect</button></p>
    <p class=msg id="mQuick"></p>
  </section>
  <section><h2>Connection</h2>
    <div class="grid">
      <i>WiFi</i><b id="sWifi">-</b>
      <i>Ethernet IP</i><b id="sEth">-</b>
      <i>Inverter host</i><b id="sHost">-</b>
      <i>WiFi SSID</i><b id="sSsid">-</b>
    </div>
  </section>
  <section><h2>Shadow Function</h2>
    <p id="rowShadowUnknown"><label>Status</label><span class="unk" id="curShadow">unknown</span></p>
    <p id="rowShadowForm" hidden><label for="iShadow">Enabled</label><input type="checkbox" id="iShadow"><button id="bShadow">Apply</button></p>
    <p class=msg id="mShadow"></p>
  </section>
  <section><h2>MQTT</h2>
    <div class="grid">
      <i>Broker</i><b id="mqttBroker">-</b>
      <i>Enabled</i><b id="mqttEnabled">-</b>
      <i>Topic prefix</i><b id="mqttTopic">-</b>
      <i>Status</i><b id="mqttStatus">-</b>
    </div>
  </section>
  <section><h2>Debug Mode</h2>
    <p><label for="iDebug">Verbose logging</label><input type="checkbox" id="iDebug"><button id="bDebug">Apply</button></p>
    <p class=msg id="mDebug"></p>
  </section>
</main>
<footer></footer>
<script src="/web_ui.js"></script>
<script>
// Config page specific JS
async function refreshAll(){
  try{var h=await apiGet('/api/health');
    $("sWifi").innerHTML=h.wifi_connected?pill('connected','ok'):pill('disconnected','bad');
    if(!isElementFocused('iDebug'))$("iDebug").checked=h.debug_mode||false;
  }catch(e){}
  try{var d=await apiGet('/api/device');
    $("sEth").textContent=d.ethernet_ip||'-';
    $("sHost").textContent=d.inverter_host||'-';
    $("sSsid").textContent=d.wifi_ssid||'-';
    if(d.firmware_version)$("fwVersion").textContent='Firmware: '+d.firmware_version;
  }catch(e){}
  try{var i=await apiGet('/api/info');
    syncShadowDisplay(i);
  }catch(e){syncShadowDisplay({});}
  try{var m=await apiGet('/api/mqtt');
    $("mqttBroker").textContent=m.broker_ip+':'+m.broker_port;
    $("mqttEnabled").innerHTML=m.enabled?pill('yes','ok'):pill('no','warn');
    $("mqttTopic").textContent=m.topic_prefix||'-';
    $("mqttStatus").innerHTML=m.connected?pill('connected','ok'):pill('disconnected','bad');
  }catch(e){}}
$("bPulse").onclick=async()=>{
  try{var r=await apiGet('/pulse');flash($("mQuick"),true,'Pulse sent');refreshAll();}catch(e){flash($("mQuick"),false,e.message);}};
$("bReconnect").onclick=async()=>{
  try{var r=await apiGet('/pulse');flash($("mQuick"),true,r.reconnected?'Reconnected':'Pulse sent (no connection)');refreshAll();}catch(e){flash($("mQuick"),false,e.message);}};
$("bShadow").onclick=async()=>{var v=$("iShadow").checked;
  try{var r=await apiPost('/api/shadow',{enabled:v});flash($("mShadow"),true,r.deferred?'Deferred: '+r.reason:'Shadow '+(v?'enabled':'disabled'));refreshAll();}catch(e){flash($("mShadow"),false,e.message);}};
$("bDebug").onclick=async()=>{var v=$("iDebug").checked;
  try{await apiPost('/api/debug',{debug:v});flash($("mDebug"),true,'Debug '+(v?'on':'off'));}catch(e){flash($("mDebug"),false,e.message);}};
refreshAll();setInterval(refreshAll,30000);
</script>
</body>
</html>
